<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vendor Login | VendorMart</title>
    <link rel="stylesheet" href="styles.css">
    <script src="app.js" defer></script>
</head>
<body>

    <nav class="navbar">
        <a href="index.html" class="brand">VendorMart</a>
        <span style="font-weight: 700; color: var(--primary); letter-spacing: 1px;">VENDOR PORTAL</span>
    </nav>

    <div class="auth-wrapper">
        <div class="auth-card">
            <h2>Vendor Login</h2>
            <p style="text-align: center; color: var(--text-muted); margin-bottom: 2rem; font-size: 0.9rem;">Access your shop dashboard and manage orders</p>
            
            <form id="vendorLoginForm">
                <div class="input-group">
                    <label style="display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 0.4rem; color: var(--text-main);">Shop Email</label>
                    <input type="email" id="email" placeholder="shop@example.com" required>
                </div>
                
                <div class="input-group">
                    <label style="display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 0.4rem; color: var(--text-main);">Password</label>
                    <input type="password" id="password" placeholder="••••••••" required>
                </div>

                <button type="submit" style="margin-top: 1rem;">Login to Dashboard</button>
            </form>
            
            <div style="margin-top: 2rem; text-align: center; font-size: 0.85rem;">
                <p>Not a vendor? <a href="login.html" style="color: var(--primary); font-weight: 600; text-decoration: none;">User Login</a></p>
            </div>
        </div>
    </div>

    <footer class="footer">
        <p>© 2026 VendorMart — Vendor Portal</p>
    </footer>

    <script>
        document.getElementById('vendorLoginForm').onsubmit = async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            try {
                const res = await fetch('http://localhost:5000/vendor/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const data = await res.json();
                if (res.ok) {
                    localStorage.setItem('vendor', JSON.stringify(data.vendor));
                    showToast('Welcome back, ' + data.vendor.vendor_name, 'success');
                    setTimeout(() => window.location.href = 'vendor_dashboard.html', 1000);
                } else {
                    showToast(data.error, 'error');
                }
            } catch {
                showToast('Server connection error', 'error');
            }
        };
    </script>
</body>
</html>
